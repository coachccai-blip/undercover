<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Undercover — raton laveur encapuchonné faisant chut">
  <defs>
    <radialGradient id="disc" cx="50%" cy="38%" r="72%">
      <stop offset="0" stop-color="#16283c"/>
      <stop offset="0.62" stop-color="#0c1826"/>
      <stop offset="1" stop-color="#060d16"/>
    </radialGradient>
    <linearGradient id="steel" x1="80" y1="40" x2="440" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#aab4c0"/>
      <stop offset="0.35" stop-color="#6c7784"/>
      <stop offset="0.62" stop-color="#39424e"/>
      <stop offset="1" stop-color="#8b95a2"/>
    </linearGradient>
    <linearGradient id="steel2" x1="120" y1="440" x2="420" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4d5764"/>
      <stop offset="0.5" stop-color="#98a3b0"/>
      <stop offset="1" stop-color="#414b57"/>
    </linearGradient>
    <linearGradient id="hood" x1="150" y1="90" x2="380" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c222c"/>
      <stop offset="0.55" stop-color="#11161e"/>
      <stop offset="1" stop-color="#080b10"/>
    </linearGradient>
    <linearGradient id="fur" x1="180" y1="150" x2="330" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e2dccd"/>
      <stop offset="0.55" stop-color="#c3bcab"/>
      <stop offset="1" stop-color="#9a9384"/>
    </linearGradient>
    <linearGradient id="mask" x1="170" y1="230" x2="350" y2="285" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a3f47"/>
      <stop offset="0.5" stop-color="#23272e"/>
      <stop offset="1" stop-color="#3a3f47"/>
    </linearGradient>
    <radialGradient id="iris" cx="42%" cy="35%" r="72%">
      <stop offset="0" stop-color="#f0c377"/>
      <stop offset="0.55" stop-color="#c98a2f"/>
      <stop offset="1" stop-color="#7d4c13"/>
    </radialGradient>
    <linearGradient id="blue" x1="220" y1="470" x2="292" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5d97c6"/>
      <stop offset="1" stop-color="#2f5f8a"/>
    </linearGradient>
    <clipPath id="clipDisc"><circle cx="256" cy="256" r="232"/></clipPath>
    <clipPath id="clipRing"><circle cx="256" cy="256" r="243"/></clipPath>
  </defs>

  <!-- Médaillon -->
  <circle cx="256" cy="256" r="248" fill="url(#steel)"/>
  <circle cx="256" cy="256" r="238" fill="#0a121c"/>
  <circle cx="256" cy="256" r="232" fill="url(#disc)"/>

  <g clip-path="url(#clipDisc)">
    <!-- Oreilles -->
    <g>
      <path d="M182 148c-14-30-16-58-6-64 11-6 34 8 51 33z" fill="#8f8778"/>
      <path d="M186 142c-10-22-12-42-5-46 8-4 24 6 37 24z" fill="#ddd7c8"/>
      <path d="M330 148c14-30 16-58 6-64-11-6-34 8-51 33z" fill="#8f8778"/>
      <path d="M326 142c10-22 12-42 5-46-8-4-24 6-37 24z" fill="#ddd7c8"/>
    </g>

    <!-- Épaules / sweat -->
    <path d="M96 512c4-92 62-146 160-146s156 54 160 146z" fill="url(#hood)"/>
    <path d="M196 372c14 34 34 52 60 52s46-18 60-52c-16 46-36 70-60 70s-44-24-60-70z" fill="#0a0e14" opacity=".8"/>

    <!-- Capuche -->
    <path d="M256 96c74 0 128 52 128 126 0 62-30 110-72 130-18 9-38 12-56 12s-38-3-56-12c-42-20-72-68-72-130C128 148 182 96 256 96z" fill="url(#hood)"/>
    <path d="M256 96c74 0 128 52 128 126 0 22-4 42-11 60 2-84-44-134-117-134s-119 50-117 134c-7-18-11-38-11-60C128 148 182 96 256 96z" fill="#252c37" opacity=".55"/>

    <path d="M128 240c0-70 54-124 128-124s128 54 128 124c-6-64-58-112-128-112S134 176 128 240z" fill="#4d86b4" opacity=".28"/>

    <!-- Visage -->
    <path d="M256 150c56 0 92 40 92 92 0 58-42 98-92 98s-92-40-92-98c0-52 36-92 92-92z" fill="url(#fur)"/>
    <path d="M256 150c30 0 54 12 70 32-18-10-42-16-70-16s-52 6-70 16c16-20 40-32 70-32z" fill="#7d766a" opacity=".7"/>

    <!-- Bandeau de masque -->
    <path d="M168 236c22-24 46-34 88-34s66 10 88 34c-6 34-26 56-52 56-16 0-28-8-36-18-8 10-20 18-36 18-26 0-46-22-52-56z" fill="url(#mask)"/>

    <!-- Yeux -->
    <g>
      <ellipse cx="214" cy="243" rx="25" ry="19" fill="#f4f1e8"/>
      <ellipse cx="298" cy="243" rx="25" ry="19" fill="#f4f1e8"/>
      <circle cx="216" cy="245" r="13.5" fill="url(#iris)"/>
      <circle cx="296" cy="245" r="13.5" fill="url(#iris)"/>
      <circle cx="216" cy="245" r="6" fill="#120d06"/>
      <circle cx="296" cy="245" r="6" fill="#120d06"/>
      <circle cx="221" cy="239" r="3.4" fill="#fff" opacity=".92"/>
      <circle cx="301" cy="239" r="3.4" fill="#fff" opacity=".92"/>
      <!-- Regard en coin, sourcils -->
      <path d="M190 228c10-9 26-12 40-8-14 1-28 5-40 12z" fill="#171a1f"/>
      <path d="M322 228c-10-9-26-12-40-8 14 1 28 5 40 12z" fill="#171a1f"/>
      <path d="M189 232c12 12 32 16 48 10-16 12-40 8-48-10z" fill="#0d0f13" opacity=".75"/>
      <path d="M323 232c-12 12-32 16-48 10 16 12 40 8 48-10z" fill="#0d0f13" opacity=".75"/>
    </g>

    <!-- Museau -->
    <path d="M256 262c26 0 44 16 44 36 0 24-20 40-44 40s-44-16-44-40c0-20 18-36 44-36z" fill="#efeade"/>
    <path d="M256 272c11 0 19 6 19 13s-8 12-19 12-19-5-19-12 8-13 19-13z" fill="#100d0b"/>
    <path d="M237 306c6 10 30 12 40-2-4 14-34 16-40 2z" fill="#0f0d0b" opacity=".85"/>

    <!-- Patte et doigt « chut » -->
    <g>
      <!-- ombre portée sur le museau -->
      <path d="M244 300c14 0 24 10 24 22s-10 22-24 22-24-10-24-22 10-22 24-22z" fill="#0a0d12" opacity=".28"/>
      <!-- poing -->
      <ellipse cx="252" cy="398" rx="52" ry="46" fill="#080b10"/>
      <ellipse cx="252" cy="391" rx="49" ry="41" fill="#1e2530"/>
      <path d="M206 392c8-16 26-26 46-26s38 10 46 26c-10-8-26-13-46-13s-36 5-46 13z" fill="#242b36" opacity=".85"/>
      <path d="M296 386c10 2 16 12 14 24-2 12-12 20-22 18z" fill="#12161d"/>
      <!-- index levé -->
      <path d="M254 398 L266 304" stroke="#161b23" stroke-width="26" stroke-linecap="round"/>
      <path d="M254 396 L266 308" stroke="#222933" stroke-width="17" stroke-linecap="round"/>
      <path d="M257 378 L267 316" stroke="#2d3643" stroke-width="6" stroke-linecap="round" opacity=".75"/>
      <circle cx="266" cy="305" r="12" fill="#252d39"/>
      <circle cx="264" cy="301" r="7.5" fill="#313b49" opacity=".9"/>
    </g>
  </g>

  <!-- Bandeau titre -->
  <g clip-path="url(#clipRing)">
    <path d="M60 372 Q256 458 452 372 L452 432 Q256 518 60 432 Z" fill="url(#steel2)"/>
    <path d="M60 372 Q256 458 452 372 L452 386 Q256 472 60 386 Z" fill="#cad3dc" opacity=".38"/>
    <path d="M60 420 Q256 506 452 420 L452 432 Q256 518 60 432 Z" fill="#0d151f" opacity=".45"/>
    <path id="titleArc" d="M96 398 Q256 484 416 398" fill="none"/>
    <text font-family="Trebuchet MS, Verdana, Segoe UI, sans-serif" font-size="44" font-weight="700"
          letter-spacing="3.5" fill="#e6ecf2" stroke="#2b333d" stroke-width="1.1">
      <textPath href="#titleArc" startOffset="50%" text-anchor="middle" dominant-baseline="middle">UNDERCOVER</textPath>
    </text>
  </g>

  <!-- Petit loup bleu -->
  <g transform="translate(256 476) scale(0.62)">
    <path d="M-36-9c10-6 22-6 30-1 4 3 8 3 12 0 8-5 20-5 30 1 3 2 3 8 0 12-8 10-22 12-30 4-3-3-9-3-12 0-8 8-22 6-30-4-3-4-3-10 0-12z" fill="url(#blue)"/>
    <ellipse cx="-19" cy="-2" rx="7" ry="5" fill="#0a121c"/>
    <ellipse cx="19" cy="-2" rx="7" ry="5" fill="#0a121c"/>
  </g>
</svg>
